                q: "12.从新民主主义到社会主义",
                a: `• 新民主主义社会是一个过渡性的社会\n\n• 党在过渡时期总路线的内容p72\n\n1.1953年6月正式提出,同年12月形成完整表述。\n\n2.从中华人民共和国成立到社会主义改造基本完成,是一个过渡时期,党在这个时期的总路线和总任务,是要在一个相当长的时期内,逐步实现国家的社会主义工业化,并逐步实现国家对农业、手工业和资本主义工商业的社会主义改造,即“一化三改”。\n\n3.它们之间相互联系,不可分离,可以比喻为鸟的“主体”和“两翼”。其中,“一化”是“主体”,“三改”是“两翼”,两者相辅相成、相互促进。`
            },
            {
                q: "13.农业、手工业的社会主义改造P76",
                a: `• 对农业的社会主义改造\n1.积极引导农民组织起来,走互助合作道路。\n2.遵循自愿互利、典型示范和国家帮助的原则,以互助合作的优越性吸引农民走互助合作道路。\n3.正确分析农村的阶级和阶层状况,制定正确的阶级政策。\n4.坚持积极领导、稳步前进的方针,采取循序渐进的步骤。\n。农业社会主义改造大体上经历了互助组、初级社和高级社三个发展阶段。\n\n• 对手工业的社会主义改造\n1.通过合作化道路,把个体手工业经济改造成为社会主义经济的过程。\n2.方针:“积极领导,稳步前进”\n3.方法:从供销合作到生产合作的道路。说服教育、典型示范和国家帮助。`
            },
            {
                q: "14.对资本主义工商业的社会主义改造的三方面、步骤P80",

            },

            },
            {
                q: "16.确立社会主义基本制度的重大意义P89",
                a: `• 中国历史上最深刻最伟大的社会变革,为当代中国一切发展进步奠定了制度基础,为中国特色社会主义制度的创立和发展提供了重要前提。`
            },
            {
                q: "17.理论成果",
                a: `• 调动一切积极因素为社会主义事业服务P93\n 调用一切积极因素为社会主义事业服务,必须坚持中国共产党的领导;调用一切积极因素为社会主义事业服务,必须发展社会主义民主政治。\n\n• 正确认识和处理社会主义社会矛盾的思想P97\n• 社会主义社会基本矛盾运动具有“又相适应又相矛盾”的特点\n• 基本矛盾:仍然是生产关系和生产力之间的矛盾,上层建筑和经济基础之间的矛盾(非对抗性,因为两两已基本适应)\n “它可以通过社会主义制度本身,不断地得到解决”\n• 主要矛盾:党的八大正确分析了社会主义改造完成后我国社会主要矛盾的变化:人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾\n• 根本任务:解放生产力,发展生产力,逐步实现社会主义现代化\n• 两类不同性质的矛盾:\n1.敌我矛盾:是人民同反抗社会主义革命、敌视和破坏社会主义建设的社会势力和社会集团的矛盾,这是根本利益对立基础上的矛盾,(对抗性)\n2.人民内部矛盾:人民内部矛盾是在人民根本利益一致基础上的矛盾(非对抗性)\n。用民主的方法解决人民内部矛盾,这是一个总方针\n■ 对于政治思想领域的人民内部矛盾,实行“团结—批评—团结”的方针,坚持说服教育、讨论的方法;\n■ 对于物质利益、分配方面的人民内部矛盾,实行统筹兼顾、适当安排的方针,兼顾国家、集体和个人三方面的利益;\n■ 对于人民群众和政府机关的矛盾,要坚持民主集中制原则,努力克服政府机关的官僚主义,也要加强对群众的思想教育;\n■ 对于科学文化领域里的矛盾,实行“百花齐放、百家争鸣”的方针,通过自由讨论和科学实践、艺术实践去解决;\n■ 对于共产党和民主党派的矛盾,实行在坚持社会主义道路和共产党领导的前提下“长期共存、互相监督”的方针;\n■ 对于民族之间的矛盾,实行民族平等、团结互助的方针。\n\n• 走中国工业化道路的思想P101\n• 在《关于正确处理人民内部矛盾的问题》中,毛泽东明确提出了中国工业化道路的问题,主要是指重工业和轻工业、农业的发展关系问题,强调要走一条有别于苏联的中国工业化道路。\n• 党的八大提出了既反保守又反冒进、坚持在综合平衡中稳步前进的方针。\n• 总方针:农业为基础,以工业为主导,以农轻重为序发展国民经济\n“两条腿走路”:重工业与轻工业、大型与中小型企业、中央工业与地方工业、沿海工业和内地工业同时并举\n• 走中国工业化道路,必须采取正确的经济建设方针。\n• 走中国工业化道路,必须调整和完善所有制结构。\n• 走中国工业化道路,必须积极探索适合我国情况的经济体制和运行机制。\n\n• 初步探索的其他理论成果P104\n• 社会主义发展阶段\n• “四个现代化”:工业现代化,农业现代化,科学文化现代化,国防现代化\n• 科学教育文化工作:“向科学进军”“两种劳动制度、两种教育制度”\n• 国防建设:“三线建设”“备战、备荒、为人民”\n• 祖国统一:\n。“武统台湾”\n。20世纪50年代中期,提出和平解放台湾:“和为贵”“爱国一家”“爱国不分先后”省亲会友、来去自由,既往不咎、立功受奖,国共合作、爱国一家,和平解放、互不破坏。“一纲四目”,一个中国原则。\n• 国际战略和外交工作\n• 执政党建设`
            },
            {
                q: "18.《论十大关系》的提出、方针与内容p94",
                a: `• 1956年,毛泽东作了《论十大关系》的报告,初步总结了我国社会主义建设的经验,明确提出要以苏为鉴,独立自主地探索适合中国情况的社会主义建设道路,标志着党探索中国社会主义建设道路的良好开端。\n\n• 《论十大关系》确立“努力把党内党外、国内国外的一切积极的因素,直接的、间接的积极因素,全部调动起来”,为社会主义建设服务的基本方针。\n\n• 主要内容(涉及生产力与生产关系、经济基础与上层建筑各方面)这个好像不是很重要:\n1.重工业和轻工业、农业的关系\n2.沿海工业和内地工业的关系\n3.经济建设和国防建设的关系\n4.国家、生产单位和生产者个人的关系\n5.中央和地方的关系\n6.汉族和少数民族的关系\n7.党和非党的关系\n8.革命和反革命的关系\n9.是非关系\n10.中国和外国的关系`
            },

            {
                q: "20.初步探索的经验教训P112",

            {
                q: "21.国际背景P118",
                a: `• 从“战争与革命”到“和平与发展”`
            },
            {
                q: "22.中国特色社会主义理论体系的形成p134",
                a: `• 1978年12月召开的党的十一届三中全会,重新确立了实事求是的思想路线,彻底否定了“以阶级斗争为纲”的错误理论和实践,确定把全党工作的着重点转移到社会主义现代化建设上来,作出实行改革开放的重大决策,实现了党的历史上具有深远意义的伟大转折\n\n• 1987年召开的党的十三大,第一次比较系统地论述了我国社会主义初级阶段理论,明确概括和全面阐发了党的“一个中心、两个基本点”的基本路线\n\n• 1997年召开的党的十五大正式提出“邓小平理论”这一概念,郑重地把邓小平理论同马克思列宁主义、毛泽东思想一起,确立为党的指导思想并写入党章(1999载入宪法)\n\n• 党的十九大、十九届六中全会提出的“十个明确”“十四个坚持”“十三个方面成就”概括了习近平新时代中国特色社会主义思想的主要内容(十九大写入党章)`
            },
            {
                q: "23.中国特色社会主义理论体系的地位p148",
                a: `• 中国特色社会主义理论体系是中国共产党长期探索的伟大理论创造,同马克思列宁主义、毛泽东思想一脉相承又与时俱进,是马克思主义中国化时代化的重大理论成果。\n\n• 中国特色社会主义理论体系是全党全国各族人民团结奋斗的共同思想基础,是战胜来自政治、经济、社会和自然界等一切风险和挑战的精神支柱,是坚持和发展中国特色社会主义的行动指南,是全面推进中华民族伟大复兴的根本指针,是我们党最可宝贵的政治和精神财富.`

            {
                q: "24.社会主义的本质p152",

            },
            {
                q: "27.党在社会主义初期阶段的基本路线P160",

            },
            {
                q: "28.“一国两制”与祖国统一",
                a: `• 1979年元旦,全国人大常委会发表《告台湾同胞书》。\n• 香港问题和澳门问题是历史上殖民主义侵略遗留下来的问题。\n• 台湾问题是国内战争遗留下来的问题,属于中国的内政,不容外国干涉。\n• 一国两制”作为实现祖国和平统的具有重大战略意义的构想,包含着丰富的科学内涵。其基本内容有:\n。坚持一个中国,这是“和平统一、一国两制”的核心,是发展两岸关系和实现和平统一的基础;\n。两制并存、在祖国统一的前提下,国家的主体部分实行社会主义制度,同时在香港、澳门、台湾保持原有的社会制度和生活方式长期不变;\n 高度自治,祖国完全统一后,香港、澳门、台湾作为中央政府全面管辖下的特别行政区,享有不同于中国其他省、市、自治区的高度自治权,台湾、香港、澳门同胞各种合法权益将得到切实尊重和维护;\n 尽最大努力争取和平统一,但不承诺放弃使用武力;\n 解决台湾问题、实现祖国完全统一,寄希望于台湾人民。`
            },
            {
                q: "29.邓小平理论的历史地位",

            },
            {
                q: "30.三个代表重要思想的核心观点p191",
                a: `• 始终代表中国先进生产力的发展要求。\n• 始终代表中国先进文化的前进方向。\n• 始终代表中国最广大人民的根本利益。`
            },
            {
                q: "31.发展先进文化的内涵p195",
                a: `• 发展先进文化,就是发展中国特色社会主义的文化,就是建设社会主义精神文明。\n\n• 发展先进文化,就是发展面向现代化、面向世界、面向未来的,民族的科学的大众的社会主义文化。\n\n• 发展先进文化,要把弘扬主旋律和提倡多样化统一起来,支持健康有益文化,努力改造落后文化,坚决抵制腐朽文化。\n\n这四个大力倡导是在第三条下面的,也需要重点掌握,题目可能会出“怎么做”or直接摆出第三条↓\n\n大力倡导一切有利于发扬爱国主义、集体主义、社会主义的思想和精神;\n大力倡导一切有利于改革开放和现代化建设的思想和精神;\n大力倡导一切有利于民族团结、社会进步、人民幸福的思想和精神;\n大力倡导一切用诚实劳动争取美好生活的思想和精神。`
            },
            {

            },
            {
                q: "33.建设社会主义政治文明P213",
                a: `• 建设社会主义政治文明,发展社会主义民主政治,是社会主义现代化建设的重要目标。\n\n• 建设社会主义政治文明涉及政治思想、政治制度、行政管理、法制建设等方面,是一个系统工程。\n建设社会主义政治文明,最根本的就是要坚持党的领导、人民当家作主和依法治国的有机统一。\n\n• 建设社会主义政治文明,必须发展社会主义民主。\n\n• 建设社会主义政治文明,必须坚持和完善中国特色社会主义政治制度。\n\n• 建设社会主义政治文明,必须坚持依法治国,建设社会主义法治国家。`
            },
            {
                q: "34.推进党的建设伟大工程",
                a: `• 坚持党在建设中国特色社会主义事业中的领导核心地位,发挥总揽全局、协调各方的作用。\n• 核心是坚持党的先进性。\n• 推进党的建设新的伟大工程,重点是加强党的执政能力建设。\n• 坚持用马克思主义武装全党。\n• 把党的最低纲领和最高纲领统一起来。\n• 民主集中制是我们党一贯坚持的根本组织制度和领导制度。\n• 坚持正确的用人导向。\n• 领导干部一定要讲学习、讲政治、讲正气。\n• 党的基层组织是党的全部工作和战斗力的基础。\n 坚持党要管党、从严治党的方针。\n\n加强和改进党的作风建设\n 核心问题是保持党同人民群众的血肉联系。\n。我们党的最大政治优势是密切联系群众,\n。党执政后的最大危险是脱离群众。\n 全心全意为人民服务,立党为公,执政为民,是我们党同一切剥削阶级政党的根本区别。\n。与人民群众同呼吸共命运的立场不能变,\n 全心全意为人民服务的宗旨不能忘,\n 坚信群众是真正英雄的历史唯物主义观点不能丢。\n• 坚决反对和防止腐败是全党一项重大的政治任务。`

                q: "35.以人为本是科学发展观的核心立场p234",
                a: `• 坚持以人为本,就要坚持发展为了人民,始终把最广大人民的根本利益放在第一位。\n• 坚持以人为本,就耍坚持发展依靠人民,从人民群众的伟大创造中汲取智慧和力量。\n• 坚持以人为本,就要坚持发展成果由人民共享,着力提高人民物质文化生活水平。\n• 坚持以人为本,最终是为了实现人的全面发展。`
            },
            {
                q: "36.科学发展观的基本要求p235",
                a: `• 全面、协调、可持续`
            },
            {
                q: "37.构建社会主义和谐社会P251",
                a: `• 胡锦涛明确指出:“社会和谐是中国特色社会主义的本质属性”`
            },
            {
                q: "38.全面提高党的建设科学化水平P257",
                a: `• 执政能力建设是党执政后的一项根本建设。\n• 保持和发展党的先进性是马克思主义政党自身建设的根本任务和永恒课题。`
            }
        ];

        // Chapters
        const chapters = [
            { id: 'intro', name: '导论' },
            { id: 'ch1', name: '第1章 毛泽东思想' },
            { id: 'ch2', name: '第2章 新民主主义革命理论' },
            { id: 'ch3', name: '第3章 社会主义改造理论' },
            { id: 'ch4', name: '第4章 社会主义建设道路初步探索' },
            { id: 'ch5', name: '第5章 中国特色社会主义理论体系' },
            { id: 'ch6', name: '第6章 邓小平理论' },
            { id: 'ch7', name: '第7章 三个代表重要思想' },
            { id: 'ch8', name: '第8章 科学发展观' },
        ];

        function extractQuestionNumber(text) {
            const m = String(text).trim().match(/^\s*(\d+)\./);
            return m ? parseInt(m[1], 10) : null;
        }

        // 章节映射（按题号范围，后续你也可以按需微调）
        function chapterIdForQuestionNumber(n) {
            if (n == null) return 'intro';
            if (n >= 1 && n <= 4) return 'intro';
            if (n >= 5 && n <= 7) return 'ch1';
            if (n >= 8 && n <= 11) return 'ch2';
            if (n >= 12 && n <= 16) return 'ch3';
            if (n >= 17 && n <= 20) return 'ch4';
            if (n >= 21 && n <= 23) return 'ch5';
            if (n >= 24 && n <= 29) return 'ch6';
            if (n >= 30 && n <= 34) return 'ch7';
            if (n >= 35 && n <= 38) return 'ch8';
            return 'intro';
        }

        // App State
        const masterCards = rawData.map((c, idx) => {
            const qn = extractQuestionNumber(c.q);
            return {
                ...c,
                _id: idx,
                _qn: qn,
                chapter: chapterIdForQuestionNumber(qn),
            };
        });

        let deck = [...masterCards];
        let activeChapter = chapters[0].id;
        let chapterCards = deck.filter((c) => c.chapter === activeChapter);
        let cards = [...chapterCards];
        let currentIndex = 0;
        let isAnswerShown = false;

        // Elements
        const flashcardEl = document.getElementById('flashcard');
        const questionEl = document.getElementById('card-question');
        const answerEl = document.getElementById('card-answer');
        const answerWrapperEl = document.getElementById('answer-wrapper');
        const progressEl = document.getElementById('progress-text');
        const selectorEl = document.getElementById('card-selector');
        const chapterSelectorEl = document.getElementById('chapter-selector');

        // Initialization
        function init() {
            // Populate chapter selector
            chapterSelectorEl.innerHTML = chapters.map((ch) => `<option value="${ch.id}">${ch.name}</option>`).join('');
            chapterSelectorEl.value = activeChapter;

            // Populate card selector
            rebuildCardSelector();
            renderCard();
        }

        function rebuildCardSelector() {
            selectorEl.innerHTML = cards
                .map((c, i) => {
                    const prefix = c._qn != null ? `${c._qn}. ` : `${i + 1}. `;
                    const label = `${prefix}${c.q.replace(/^\s*\d+\./, '').trim().substring(0, 12)}...`;
                    return `<option value="${i}">${label}</option>`;
                })
                .join('');
        }

        function applyChapterFilter() {
            chapterCards = deck.filter((c) => c.chapter === activeChapter);
            cards = [...chapterCards];
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex > cards.length - 1) currentIndex = 0;
            rebuildCardSelector();
        }

        function setChapter(chapterId) {
            activeChapter = chapterId;
            applyChapterFilter();
            currentIndex = 0;
            renderCard();
            chapterSelectorEl.blur();
        }

        // Render current card
        function renderCard() {
            const card = cards[currentIndex];
            questionEl.textContent = card.q;
            
            // Check if answer contains HTML (table) or plain text
            if (card.a.includes('<table')) {
                answerEl.innerHTML = card.a;
            } else {
                answerEl.textContent = card.a;
            }
            
            progressEl.textContent = `${currentIndex + 1} / ${cards.length}`;
            selectorEl.value = currentIndex;
            
            // Reset answer visibility
            isAnswerShown = false;
            answerWrapperEl.classList.add('hidden');
        }

        // Toggle answer visibility (show below question)
        function toggleCard() {
            isAnswerShown = !isAnswerShown;
            if (isAnswerShown) {
                answerWrapperEl.classList.remove('hidden');
            } else {
                answerWrapperEl.classList.add('hidden');
            }
        }

        // Navigation
        function nextCard(e) {
            if(e) e.stopPropagation();
            if (currentIndex < cards.length - 1) {
                currentIndex++;
            } else {
                // 本章节最后一题：跳到下一章节第一题
                const currentChapterIdx = chapters.findIndex((c) => c.id === activeChapter);
                const nextChapterIdx = currentChapterIdx >= 0 ? (currentChapterIdx + 1) % chapters.length : 0;
                activeChapter = chapters[nextChapterIdx].id;
                chapterSelectorEl.value = activeChapter;
                currentIndex = 0;
                applyChapterFilter();
            }
            renderCard();
        }

        function prevCard(e) {
            if(e) e.stopPropagation();
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = cards.length - 1; // Loop to end
            }
            renderCard();
        }

        function jumpToCard(index) {
            currentIndex = parseInt(index);
            renderCard();
            // Remove focus from select to avoid keyboard navigation issues
            selectorEl.blur();
        }

        function shuffleCards() {
            // Fisher-Yates shuffle（对全题库乱序）
            deck = [...masterCards];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            currentIndex = 0;
            applyChapterFilter();
            
            renderCard();
            // Optional: visual feedback
            const btn = document.querySelector('button[onclick="shuffleCards()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> 已乱序';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 1000);
        }

        function resetOrder() {
            deck = [...masterCards];
            currentIndex = 0;
            applyChapterFilter();
            renderCard();

            const btn = document.querySelector('button[onclick="resetOrder()"]');
            if (btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> 已正序';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 1000);
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                // Only flip if not focused on select/button
                if (document.activeElement.tagName !== 'SELECT' && document.activeElement.tagName !== 'BUTTON') {
                     toggleCard();
                     e.preventDefault(); 
                }
            } else if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        });

        // Run
        init();

    </script>
</body>
</html>
