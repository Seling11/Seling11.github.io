<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title></title>
  <style>
    /* ====== Design Tokens ====== */
    :root{
      --bg: #0b1020;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --faint: rgba(255,255,255,.45);
      --line: rgba(255,255,255,.12);
      --shadow: 0 18px 55px rgba(0,0,0,.35);
      --radius: 18px;

      --accent: #7c5cff;
      --accent2:#22c55e;
      --warn:#f59e0b;

      --max: 1080px;
      --photo-h: 140px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
              Arial, "Noto Sans", "Liberation Sans", "PingFang SC", "Hiragino Sans GB",
              "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    }

    /* Light theme */
    [data-theme="light"]{
      --bg: #f6f7fb;
      --card: rgba(0,0,0,.04);
      --card2: rgba(0,0,0,.06);
      --text: rgba(0,0,0,.88);
      --muted: rgba(0,0,0,.62);
      --faint: rgba(0,0,0,.44);
      --line: rgba(0,0,0,.10);
      --shadow: 0 18px 55px rgba(0,0,0,.10);
    }

    *{ box-sizing: border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background: radial-gradient(1200px 700px at 20% -10%, rgba(124,92,255,.35), transparent 55%),
                  radial-gradient(1000px 600px at 80% 0%, rgba(34,197,94,.22), transparent 60%),
                  radial-gradient(1000px 700px at 50% 110%, rgba(245,158,11,.18), transparent 55%),
                  var(--bg);
      min-height: 100vh;
      line-height: 1.55;
    }

    a{ color: inherit; text-decoration: none; }
    a:hover{ text-decoration: underline; }

    .container{
      width: min(var(--max), calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 70px;
    }

    /* ====== Top Bar ====== */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,0));
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    [data-theme="light"] .topbar{
      background: linear-gradient(to bottom, rgba(255,255,255,.75), rgba(255,255,255,0));
      border-bottom: 1px solid rgba(0,0,0,.06);
    }

    .topbar-inner{
      width: min(var(--max), calc(100% - 36px));
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      padding: 12px 0;
    }

    /* Small screens: move nav to next row */
    @media (max-width: 740px){
      .topbar-inner{ flex-wrap: wrap; }
      .brand{ min-width: 0; order: 1; flex: 1 1 auto; }
      .brand-title{ min-width: 0; }
      .actions{ min-width: auto; order: 2; flex: 0 0 auto; }
      .nav{ width: 100%; order: 3; justify-content: center; }

      /* 小屏幕：隐藏“导出PDF”按钮 */
      #btnExport{ display:none; }
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 220px;
    }
    .avatar{
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.45), transparent 40%),
        linear-gradient(135deg, rgba(124,92,255,.9), rgba(34,197,94,.75));
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.18);
      flex: 0 0 auto;
    }
    .brand-title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .brand-title b{ font-size: 14px; letter-spacing:.2px; }
    .brand-title span{ font-size: 12px; color: var(--muted); }

    .nav{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      justify-content:center;
    }
    .pill{
      padding: 8px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12.5px;
      transition: transform .15s ease, background .15s ease;
      user-select:none;
    }
    .pill:hover{ transform: translateY(-1px); background: var(--card2); color: var(--text); }

    .actions{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 220px;
      justify-content:flex-end;
    }
    .btn{
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12.5px;
      cursor:pointer;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover{ transform: translateY(-1px); background: var(--card2); border-color: rgba(124,92,255,.35); }
    .btn.secondary{ color: var(--muted); }
    .btn.primary{
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(34,197,94,.78));
      border-color: rgba(255,255,255,.14);
    }

    /* ====== Hero ====== */
    .hero{
      margin-top: 22px;
      padding: 26px;
      border-radius: calc(var(--radius) + 6px);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      overflow:hidden;
      position: relative;
    }

    /* Subtle hover for non-click modules (less than projects) */
    .hero, .card, .contact-card{
      transition: transform .22s cubic-bezier(.18,1.08,.2,1), border-color .18s ease;
      transform-origin: center top;
    }
    @media (hover: hover){
      .hero:hover, .card:hover, .contact-card:hover{
        transform: translateY(-1px);
        border-color: rgba(124,92,255,.22);
      }
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(800px 260px at 10% 10%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(700px 260px at 90% 10%, rgba(34,197,94,.22), transparent 60%);
      opacity: .9;
      pointer-events:none;
      mask-image: linear-gradient(to bottom, black, transparent 70%);
    }
    .hero-grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
      position: relative;
    }
    @media (max-width: 900px){
      .hero-grid{ grid-template-columns: 1fr; }
    }
    .h-title{
      font-size: clamp(24px, 3vw, 34px);
      margin: 0 0 6px 0;
      letter-spacing: .2px;
    }
    .h-sub{
      margin: 0 0 14px 0;
      color: var(--muted);
      font-size: 14.5px;
    }
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .chip{
      font-size: 12.5px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.10);
      color: var(--muted);
    }
    [data-theme="light"] .chip{ background: rgba(255,255,255,.6); }

    .contact-card{
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(0,0,0,.10);
      padding: 14px 14px 12px;
    }
    [data-theme="light"] .contact-card{ background: rgba(255,255,255,.65); }

    .contact-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .contact-hint{
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .btn.compact{
      padding: 7px 10px;
      border-radius: 999px;
    }
    .kv{
      display:grid;
      grid-template-columns: 86px 1fr;
      gap: 8px 10px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
    .kv b{ color: var(--text); font-weight: 600; }
    .kv code{
      font-family: var(--mono);
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      word-break: break-all;
    }

    /* ====== Sections ====== */
    section{ margin-top: 22px; }
    .section-title{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 12px;
      margin: 0 0 12px 0;
    }
    .section-title h2{
      margin:0;
      font-size: 16px;
      letter-spacing:.2px;
    }
    .section-title p{
      margin:0;
      color: var(--muted);
      font-size: 12.5px;
    }

    .grid-2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 900px){
      .grid-2{ grid-template-columns: 1fr; }
    }

    .card{
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    [data-theme="light"] .card{ box-shadow: 0 10px 30px rgba(0,0,0,.08); }

    /* ====== Projects list ====== */
    .projects-grid{ display:block; }

    /* Hover cue (subtle, no scale/translate to avoid layout "nudge") */
    .project{
      transition: border-color .22s ease, background .22s ease;
    }
    @media (hover: hover){
      .project:hover{
        border-color: rgba(124,92,255,.35);
        background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      }
    }

    .list{
      margin: 10px 0 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13.5px;
    }
    .list li{ margin: 6px 0; }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .meta .meta-break{
      flex-basis: 100%;
      height: 0;
    }
    .tag{
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(0,0,0,.10);
    }
    [data-theme="light"] .tag{ background: rgba(255,255,255,.65); }

    /* ====== Projects (collapsible) ====== */
    .projects-grid{ display:block; }
    .projects-grid .project{ margin-bottom: 14px; }
    .projects-grid .project:last-child{ margin-bottom: 0; }

    .project{
      border-radius: calc(var(--radius) + 2px);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--card2), var(--card));
      overflow:hidden;
    }
    details{ border-radius: inherit; }
    summary{
      list-style:none;
      cursor:pointer;
      padding: 16px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 16px;
      user-select:none;
      position: relative;
    }
    summary::-webkit-details-marker{ display:none; }

    /* Hover hint: "点击展开" (no layout shift; overlay) */
    summary::after{
      content: var(--hint-open, "点击展开");
      position: absolute;
      left: 16px;
      bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      font-size: 14px;
      line-height: 1;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .14s ease, transform .14s ease;
      pointer-events: none;
      z-index: 2;
      white-space: nowrap;
    }
    @media (hover: hover){
      details:not([open]):hover > summary::after{
        opacity: 1;
        transform: translateY(0);
      }
    }
    details:not([open]) > summary:focus-visible::after{
      opacity: 1;
      transform: translateY(0);
    }
    details[open] > summary::after{ content: ""; }

    /* Small screens: place hint where it won't push content; allow slight overlay */
    @media (max-width: 900px){
      summary::after{
        left: auto;
        bottom: auto;
        right: 12px;
        top: 12px;
        padding: 8px 10px;
        border-radius: 999px;
        font-size: 12.5px;
      }
    }

    .proj-left{
      flex: 1 1 auto;
      min-width: 0;
    }
    .proj-title{
      display:flex;
      gap: 8px;
      align-items:center;
      flex-wrap:wrap;
      margin:0;
    }
    .proj-title b{
      font-size: 14.5px;
      letter-spacing:.2px;
    }
    .proj-title .role{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.10);
      white-space: nowrap;
    }
    [data-theme="light"] .proj-title .role{ background: rgba(255,255,255,.65); }
    .proj-sub{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      display:flex;
      gap: 10px;
      flex-wrap:wrap;
    }
    .proj-sub span{ display:inline-flex; align-items:center; gap: 6px; }

    /* Photo placeholder (no forced aspect ratio; images keep their real proportions) */
    .photo{
      /* 预览高度优先级：局部（单卡片）> 项目区统一 > 全局 token */
      --photo-h-cur: var(--photo-h-local, var(--photo-h-project, var(--photo-h)));
      /* 不用 vw：避免窗口变窄但卡片宽度不变时图片区也跟着缩 */
      /* 让图片决定理想宽度，但最大宽度受 summary/卡片约束 */
      max-width: 70%;
      min-width: 220px;
      min-height: calc(var(--photo-h-cur, var(--photo-h)) + 20px);
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.28);
      background:
        radial-gradient(180px 120px at 30% 20%, rgba(124,92,255,.30), transparent 60%),
        radial-gradient(180px 120px at 70% 30%, rgba(34,197,94,.18), transparent 65%),
        rgba(0,0,0,.16);
      position: relative;
      overflow:hidden;
      flex: 0 1 auto;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 10px;
    }
    [data-theme="light"] .photo{
      border: 1px dashed rgba(0,0,0,.20);
      background:
        radial-gradient(180px 120px at 30% 20%, rgba(124,92,255,.20), transparent 60%),
        radial-gradient(180px 120px at 70% 30%, rgba(34,197,94,.16), transparent 65%),
        rgba(255,255,255,.65);
    }

    .photo .photo-strip{
      max-width: 100%;
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 5px;
      overflow: hidden; /* 折叠态：单行预览，多余图片不显示 */
    }
    .photo img{
      height: var(--photo-h-cur, var(--photo-h));
      width: auto;
      object-fit: contain;
      border-radius: 10px;
      display:none; /* 默认隐藏：部署后用JS HEAD探测显示 */
      cursor: zoom-in;
      flex: 0 0 auto;
      max-width: 100%;
    }
    @media (max-width: 900px){
      summary{ flex-direction: column; }
      .photo{ width: 100%; max-width: 100%; }
    }

    /* .photo theme + img styles moved above */
    .photo .ph{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      padding: 10px;
      text-align:center;
    }
    .photo .ph b{ color: var(--text); font-size: 12.5px; }
    .photo .ph code{
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
    }

    details[open] summary{
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,.06);
    }
    [data-theme="light"] details[open] summary{
      background: rgba(255,255,255,.45);
    }

    /* 折叠态放不下时：展开后把图片移到正文顶部，summary 里的预览隐藏（避免重复） */
    details.has-overflow[open] summary .photo{ display:none; }

    .proj-gallery{
      grid-column: 1 / -1;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.08);
      padding: 10px;
    }
    [data-theme="light"] .proj-gallery{
      background: rgba(255,255,255,.55);
    }
    .proj-gallery .photo-strip{
      display:flex;
      flex-wrap:wrap;
      align-items:flex-start;
      justify-content:flex-start;
      gap: 10px;
    }
    .proj-gallery img{
      height: var(--photo-h);
      width: auto;
      object-fit: contain;
      border-radius: 10px;
      display:block;
      cursor: zoom-in;
    }

    .proj-body{
      padding: 14px 16px 16px;
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 14px;
    }
    details[open] .proj-body{
      animation: body-fade 200ms ease;
    }
    @media (max-width: 900px){
      .proj-body{ grid-template-columns: 1fr; }
      .photo{ width: 100%; max-width: 100%; }
      .photo{ justify-content: center; }
      .photo .photo-strip{ justify-content: center; }
    }

    @keyframes body-fade{
      0%{ opacity: 0; }
      100%{ opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce){
      .project{ transition: none !important; }
      details[open] .proj-body{ animation: none !important; }
    }
    .hint{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.08);
      color: var(--muted);
      font-size: 12.5px;
    }
    [data-theme="light"] .hint{ background: rgba(255,255,255,.55); }

    .foot{
      margin-top: 22px;
      color: var(--faint);
      font-size: 12px;
      text-align:center;
    }
    .kbd{
      font-family: var(--mono);
      border: 1px solid var(--line);
      background: var(--card);
      padding: 1px 6px;
      border-radius: 7px;
      color: var(--text);
    }

    /* Print */
    /* Small screens (late override to beat base rules) */
    @media (max-width: 740px){
      .topbar-inner{ flex-wrap: wrap; }
      .brand{ min-width: 0; order: 1; flex: 1 1 auto; }
      .brand-title{ min-width: 0; }
      .actions{ min-width: auto; order: 2; flex: 0 0 auto; }
      .nav{ width: 100%; order: 3; justify-content: center; }

      /* 小屏幕：隐藏“导出PDF”按钮 */
      #btnExport{ display:none; }
    }

    @media print{
      .topbar, .actions, .pill, #btnCopy{ display:none !important; }
      body{ background: #fff; color:#000; }
      .card, .hero, .project{
        box-shadow:none !important;
        background:#fff !important;
        border-color:#ddd !important;
      }
      .photo{ border-color:#bbb !important; background:#fff !important; }
      a{ text-decoration: none; }
      .projects-grid{ display: block !important; }
    }
  </style>
</head>

<body>
  <!-- ===== Sticky Nav ===== -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="avatar" aria-hidden="true"></div>
        <div class="brand-title">
          <b id="brandTitle"></b>
          <span id="brandSubtitle"></span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="站内导航"></nav>

      <div class="actions">
        <button class="btn secondary" id="btnTheme" type="button"></button>
        <button class="btn" id="btnExport" type="button" onclick="window.print()"></button>
      </div>
    </div>
  </div>

  <main class="container">
    <!-- ===== Hero / About ===== -->
    <section id="about" class="hero">
      <div class="hero-grid">
        <div>
          <h1 class="h-title" id="aboutName"></h1>
          <p class="h-sub" id="aboutSubtitle"></p>

          <div class="chips" id="aboutChips"></div>
        </div>

        <aside class="contact-card" aria-label="联系方式">
          <div class="contact-head">
            <b style="font-size:14px;" id="contactTitle"></b>
            <button class="btn primary compact" id="btnCopy" type="button"></button>
          </div>
          <div class="contact-hint" id="contactHint"></div>
          <div class="kv" id="contactKv"></div>
        </aside>
      </div>
    </section>

    <!-- ===== Education & Coursework ===== -->
    <section id="edu">
      <div class="section-title">
        <h2 id="eduTitle"></h2>
        <p id="eduDesc"></p>
      </div>

      <div class="grid-2" id="eduGrid"></div>
    </section>

    <!-- ===== Skills ===== -->
    <section id="skills">
      <div class="section-title">
        <h2 id="skillsTitle"></h2>
        <p id="skillsDesc"></p>
      </div>

      <div class="grid-2" id="skillsGrid"></div>
    </section>

    <!-- ===== Projects ===== -->
    <section id="projects">
      <div class="section-title">
        <h2 id="projectsTitle"></h2>
        <p id="projectsDesc"></p>
      </div>

      <div class="projects-grid" id="projectsGrid"></div>
    </section>

    <!-- ===== Honors ===== -->
    <section id="honors">
      <div class="section-title">
        <h2 id="honorsTitle"></h2>
        <p id="honorsDesc"></p>
      </div>

      <div id="honorsWrap"></div>
    </section>

    <div class="foot">
      © <span id="year"></span> <span id="footerText"></span>
    </div>
  </main>

  <script>
    // ===== Theme =====
    (function initTheme(){
      const saved = localStorage.getItem("theme");
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      const theme = saved || (prefersLight ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();

    document.getElementById("btnTheme").addEventListener("click", () => {

    // ===== Auto-load project images by naming convention =====
    // 规则：同一个项目图片按 -a / -b / -c ... 命名。
    // 你只要把文件放进 assets/ 并按规则命名，不需要再改 HTML。

    const PROJECT_IMG_MAX = 6;
    const PROJECT_IMG_LETTERS = ["a","b","c","d","e","f","g","h","i","j"]; // 够用；最终会按 MAX 截断
    const PROJECT_IMG_EXTS = ["png","jpg","jpeg","webp","gif"]; // 常见格式

    function parseSeedPathFromPhoto(photo){
      // 最高优先：由内容渲染写入的 seed
      const seedFromData = photo?.dataset?.seed;
      if(seedFromData) return seedFromData;

      // 优先：已有 img 的 src
      const existing = photo.querySelector(".photo-strip img[src]");
      const seed = existing ? existing.getAttribute("src") : null;
      if(seed) return seed;

      // 其次：占位区 code 里的路径
      const code = photo.querySelector(".ph code");
      const codeText = code ? code.textContent.trim() : "";
      return codeText || null;
    }

    function parsePrefixAndExt(seed){
      // 期望形如 assets/project-1-a.png
      // 返回 { prefix: "assets/project-1-", ext: "png" }
      if(!seed) return null;
      const clean = seed.split("?")[0].split("#")[0];
      const m = clean.match(/^(.*-)([a-zA-Z])\.(\w+)$/);
      if(!m) return null;
      return { prefix: m[1], ext: m[3].toLowerCase() };
    }

    async function headOk(url){
      try{
        const r = await fetch(url, { method: "HEAD", cache: "no-store" });
        if(r.ok) return true;
        // 有些服务对 HEAD 支持不完整，降级用 GET 探测
        if(r.status === 405 || r.status === 501){
          const r2 = await fetch(url, { method: "GET", cache: "no-store" });
          return r2.ok;
        }
        return false;
      }catch(_){
        return false;
      }
    }

    function setPlaceholderVisibility(photo){
      const ph = photo.querySelector(".ph");
      if(!ph) return;
      const anyShown = Array.from(photo.querySelectorAll(".photo-strip img")).some(i => i.style.display === "block");
      ph.style.display = anyShown ? "none" : "flex";
    }

    function setHasMedia(details, hasMedia){
      if(!details) return;
      details.classList.toggle("has-media", !!hasMedia);
    }

    function ensureImg(strip, src){
      // strip 会在 autoLoadPhoto 中被清空，所以这里直接创建即可
      const img = document.createElement("img");
      img.src = src;
      img.alt = "项目图片";
      img.style.display = "none";
      enableImageZoom(img);
      strip.appendChild(img);
      return img;
    }

    function openImageInNewTab(src){
      if(!src) return;
      const a = document.createElement("a");
      a.href = src;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function enableImageZoom(img){
      if(!img) return;
      img.title = img.title || "点击查看大图";
      img.tabIndex = 0;

      const open = (e) => {
        // 在 summary 内点击图片时，避免触发 details 切换
        if(e){
          e.preventDefault();
          e.stopPropagation();
        }
        openImageInNewTab(img.currentSrc || img.src);
      };

      img.addEventListener("click", open);
      img.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " ") open(e);
      });
    }

    let previewSyncPending = false;
    function schedulePreviewClamp(_photo){
      // 为了让四个项目图片区高度一致：任何一个 photo 需要重算时，都同步全体
      if(previewSyncPending) return;
      previewSyncPending = true;
      requestAnimationFrame(() => {
        previewSyncPending = false;
        syncProjectPreviewHeightAndClamp();
      });
    }

    function getProjectPhotos(){
      return Array.from(document.querySelectorAll("#projectsGrid summary .photo"));
    }

    function computeUnifiedProjectPreviewHeight(photos){
      const rootStyles = getComputedStyle(document.documentElement);
      const tokenH = parseFloat(rootStyles.getPropertyValue("--photo-h")) || 140;
      const minH = 96;
      const step = 6;
      const allowedOverflow = 10;

      const maxPreviewImages = 3;

      let unifiedH = Math.max(minH, tokenH);
      let hasAny = false;

      // 先清理：去掉旧的局部覆盖，确保测量基于同一套规则
      for(const photo of photos){
        photo.style.removeProperty("--photo-h-local");
        const strip = photo.querySelector(".photo-strip");
        if(!strip) continue;
        for(const img of Array.from(strip.querySelectorAll("img"))){
          if(img.dataset.found === "1") img.style.display = "block";
        }
      }

      // 针对每个项目：找到“在不隐藏图片的情况下能放进一行”的最小高度
      // 最终取所有项目里的最小值，作为统一高度（保证大家一致）
      for(const photo of photos){
        const strip = photo.querySelector(".photo-strip");
        if(!strip) continue;
        const found = Array.from(strip.querySelectorAll("img")).filter(img => img.dataset.found === "1");
        if(found.length <= 1) continue;

        // 规则：图片数量 > 3 时，折叠预览默认只展示 3 张，
        // 因此统一高度测量也按 3 张来算，避免为了“塞进一行”而过度缩小高度。
        if(found.length > maxPreviewImages){
          for(let i = 0; i < found.length; i++){
            found[i].style.display = i < maxPreviewImages ? "block" : "none";
          }
        }

        const w = strip.clientWidth;
        if(w <= 0) continue;

        hasAny = true;
        let curH = Math.max(minH, tokenH);
        photo.style.setProperty("--photo-h-local", `${curH}px`);

        let guard = 0;
        while(strip.scrollWidth > strip.clientWidth + allowedOverflow && curH - step >= minH && guard++ < 50){
          curH -= step;
          photo.style.setProperty("--photo-h-local", `${curH}px`);
        }

        unifiedH = Math.min(unifiedH, curH);
      }

      // 如果没有任何需要测量的（比如都没图/都只有一张），就保持 tokenH
      return hasAny ? unifiedH : Math.max(minH, tokenH);
    }

    function syncProjectPreviewHeightAndClamp(){
      const grid = document.getElementById("projectsGrid");
      if(!grid) return;

      const photos = getProjectPhotos();
      if(photos.length === 0) return;

      const unifiedH = computeUnifiedProjectPreviewHeight(photos);
      grid.style.setProperty("--photo-h-project", `${unifiedH}px`);

      // 统一高度确定后：移除局部覆盖，让所有卡片使用同一个高度
      for(const photo of photos){
        photo.style.removeProperty("--photo-h-local");
        clampPreviewToOneLine(photo);
      }
    }

    function clampPreviewToOneLine(photo){
      const strip = photo.querySelector(".photo-strip");
      if(!strip) return;

      const imgs = Array.from(strip.querySelectorAll("img"));
      const found = imgs.filter(img => img.dataset.found === "1");
      if(found.length <= 1){
        const details = photo.closest("details");
        if(details) details.classList.toggle("has-overflow", false);
        return;
      }

      const maxPreviewImages = 3;

      // 尽可能多显示：
      // 1) 先把预览高度从默认值逐步缩小，争取把更多图片塞进一行
      // 2) 如果缩到下限仍放不下，再从末尾开始隐藏
      for(const img of found){ img.style.display = "block"; }
      const allowedOverflow = 10; // 允许少量像素误差，避免过度隐藏

      let hiddenCount = 0;

      // 规则：图片数量 > 3 时，默认视为折叠态放不下；先强制只显示 3 张
      if(found.length > maxPreviewImages){
        for(let i = maxPreviewImages; i < found.length; i++){
          found[i].style.display = "none";
          hiddenCount++;
        }
      }
      // strip 为 nowrap + overflow hidden；scrollWidth>clientWidth 说明放不下
      // 用 allowedOverflow 余量抵消小数像素/取整误差，尽量不隐藏
      while(strip.scrollWidth > strip.clientWidth + allowedOverflow && found.length - hiddenCount > 1){
        const idx = found.length - 1 - hiddenCount;
        found[idx].style.display = "none";
        hiddenCount++;
      }

      const details = photo.closest("details");
      if(details) details.classList.toggle("has-overflow", hiddenCount > 0);
    }

    function getAllSrcsFromPhoto(photo){
      try{
        const raw = photo.dataset.allSrcs || "[]";
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      }catch(_){
        return [];
      }
    }

    function removeGallery(details){
      const gallery = details.querySelector(".proj-gallery");
      if(gallery) gallery.remove();
    }

    function buildGallery(details){
      removeGallery(details);
      const photo = details.querySelector("summary .photo");
      if(!photo) return;
      const allSrcs = getAllSrcsFromPhoto(photo);
      if(allSrcs.length === 0) return;

      const maxPreviewImages = 3;

      // 规则：图片数量 > 3 时，默认视为折叠态放不下（即使宽度够）。
      // 这里直接确保 has-overflow 置为 true，保证展开时走 gallery 逻辑。
      if(allSrcs.length > maxPreviewImages){
        details.classList.add("has-overflow");
      }

      // 仅当折叠态放不下（发生溢出）时，展开后才把图片移到正文顶部
      // 一旦需要移动：展示全部图片（不是只展示放不下的那几张）
      if(!details.classList.contains("has-overflow")) return;

      const body = details.querySelector(".proj-body");
      if(!body) return;

      const gallery = document.createElement("div");
      gallery.className = "proj-gallery";
      gallery.setAttribute("aria-label", "项目图片（展开）");

      const strip = document.createElement("div");
      strip.className = "photo-strip";
      gallery.appendChild(strip);

      for(const src of allSrcs){
        const img = document.createElement("img");
        img.src = src;
        img.alt = "项目图片";
        enableImageZoom(img);
        strip.appendChild(img);
      }

      body.insertBefore(gallery, body.firstChild);
    }

    function wireDetailsToggles(){
      const detailsList = Array.from(document.querySelectorAll(".project details"));
      for(const details of detailsList){
        details.addEventListener("toggle", () => {
          if(details.open){
            buildGallery(details);
          }else{
            removeGallery(details);
            const photo = details.querySelector("summary .photo");
            if(photo) schedulePreviewClamp(photo);
          }
        });

        const body = details.querySelector(".proj-body");
        if(body){
          body.addEventListener("click", (e) => {
            if(!details.open) return;
            if(e.target && e.target.closest && e.target.closest("img")) return;
            if(e.target && e.target.closest && e.target.closest("a")) return;
            if(e.target && e.target.closest && e.target.closest("button")) return;
            details.open = false;
          });
        }
      }
    }

    async function probeAndShow(img){
      const src = img.getAttribute("src");
      if(!src) return false;
      const ok = await headOk(src);
      if(ok){
        img.style.display = "block";
        return true;
      }
      img.style.display = "none";
      return false;
    }

    async function autoLoadPhoto(photo){
      const strip = photo.querySelector(".photo-strip");
      if(!strip) return;

      const details = photo.closest("details");

      const seed = parseSeedPathFromPhoto(photo);
      const parsed = parsePrefixAndExt(seed);
      if(!parsed){
        // 没法解析就退回：只尝试显示已有 img
        const imgs = Array.from(strip.querySelectorAll("img"));
        for(const img of imgs){ await probeAndShow(img); }
        setPlaceholderVisibility(photo);
        return;
      }

      const prefix = parsed.prefix;
      const preferredExt = parsed.ext;
      const letters = PROJECT_IMG_LETTERS.slice(0, PROJECT_IMG_MAX);

      // 清空旧 img（由脚本按规则重建）
      for(const img of Array.from(strip.querySelectorAll("img"))){ img.remove(); }

      const foundSrcs = [];

      for(const letter of letters){
        // 先试 seed 同扩展名，再试常见扩展名
        const exts = [preferredExt, ...PROJECT_IMG_EXTS.filter(e => e !== preferredExt)];
        let foundSrc = null;
        for(const ext of exts){
          const candidate = `${prefix}${letter}.${ext}`;
          if(await headOk(candidate)){
            foundSrc = candidate;
            break;
          }
        }
        if(foundSrc){
          const img = ensureImg(strip, foundSrc);
          img.style.display = "block";
          img.dataset.found = "1";
          foundSrcs.push(foundSrc);
          img.addEventListener("load", () => schedulePreviewClamp(photo), { once: true });
        }
      }

      setPlaceholderVisibility(photo);

      // 记录“完整图片列表”，用于展开态 gallery（折叠态可能会隐藏部分）
      photo.dataset.allSrcs = JSON.stringify(foundSrcs);
      setHasMedia(details, foundSrcs.length > 0);

      if(details && details.open){
        // 先算预览能放下多少，再把“放不下的”放进展开区
        schedulePreviewClamp(photo);
        requestAnimationFrame(() => buildGallery(details));
      }else{
        schedulePreviewClamp(photo);
      }
    }

    // 初始化：所有项目图片区域按规则自动加载（需在 projects 渲染完成后调用）
    async function initProjectPhotos(){
      const photos = Array.from(document.querySelectorAll(".photo"));
      for(const photo of photos){
        await autoLoadPhoto(photo);
      }

      wireDetailsToggles();

      // 兜底：窗口尺寸变化时，重新计算折叠态可见数量
      window.addEventListener("resize", () => {
        for(const photo of Array.from(document.querySelectorAll("summary .photo"))){
          const details = photo.closest("details");
          if(details){
            schedulePreviewClamp(photo);
            if(details.open) requestAnimationFrame(() => buildGallery(details));
          }
        }
      }, { passive: true });
    }

    // ===== Tiny toast =====
    const toastEl = document.createElement("div");
    toastEl.style.cssText = `
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.55); backdrop-filter: blur(10px);
      color: rgba(255,255,255,.92); font-size: 12.5px; opacity:0;
      transition: opacity .15s ease, transform .15s ease;
      z-index: 9999; pointer-events:none;
    `;
    document.body.appendChild(toastEl);
    let toastTimer = null;
    function toast(msg){
      toastEl.textContent = msg;
      toastEl.style.opacity = "1";
      toastEl.style.transform = "translateX(-50%) translateY(-2px)";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{
        toastEl.style.opacity = "0";
        toastEl.style.transform = "translateX(-50%) translateY(6px)";
      }, 1400);
    }

    // year
    document.getElementById("year").innerText = new Date().getFullYear();

    // ===== Bootstrap =====
    (async function bootstrap(){
      try{
        const content = await loadContent();
        applyContent(content);
        await initProjectPhotos();
      }catch(e){
        console.error(e);
      }
    })();

    // Projects: use native <details>/<summary> interaction (minimal motion)
  </script>
</body>
</html>
